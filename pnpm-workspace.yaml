strictDepBuilds: true
dangerouslyAllowAllBuilds: false
blockExoticSubdeps: true
minimumReleaseAge: 10080
saveExact: true

overrides:
  deepmerge-ts: '8.0.0'
  brace-expansion@<1.1.21: '^1.1.21'
  brace-expansion@>=4.0.0 <5.0.12: '^5.0.12'
  # Avisos high de noviembre 2026. Todos llegan por devDependencies (shadcn y vitest), no por el build de producción.
  vite@>=7.0.0 <7.3.7: '^7.3.7'
  body-parser@>=2.0.0 <2.4.0: '^2.4.0'
  undici@>=7.0.0 <7.30.1: '^7.30.1'
  systeminformation@<5.33.16: '^5.33.16'

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (DoS con patrones anidados): no hay versión corregida publicada (la última es 3.0.3).
    # Solo llega por eslint-config-next > fast-glob > micromatch (devDependency, no va al build de producción)
    # y ESLint solo expande los globs del propio repo. Sacar esta línea cuando exista braces >=3.0.4.
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@prisma/client@6.19.3': true
  '@prisma/engines@6.19.3': true
  esbuild@0.28.1: true
  fsevents@2.3.3: true
  prisma@6.19.3: true
  sharp@0.35.5: true
  unrs-resolver@1.12.2: true
